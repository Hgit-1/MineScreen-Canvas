name: Build MineScreen

"on":
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minescreen-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read and validate mod version
        id: version
        shell: pwsh
        run: |
          $versionLine = Get-Content -LiteralPath gradle.properties |
            Where-Object { $_ -match '^mod_version=' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'mod_version is missing from gradle.properties'
          }
          $version = ($versionLine -replace '^mod_version=', '').Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+].+)?$') {
            throw "Invalid mod_version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw "Release tag v$tagVersion does not match mod_version $version"
            }
          }

      - name: Build, test, and package
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: Dedicated-server lifecycle smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          @'
          # Accepted only for the disposable CI smoke-test server.
          eula=true
          '@ | Set-Content -LiteralPath run/eula.txt -Encoding ascii
          @'
          online-mode=false
          level-name=qa-world
          motd=MineScreen CI
          max-players=1
          view-distance=2
          simulation-distance=2
          '@ | Set-Content -LiteralPath run/server.properties -Encoding ascii

          .\gradlew.bat runServerSmoke --no-daemon --stacktrace
          $log = Get-Content -LiteralPath run/logs/latest.log -Raw
          $required = @(
            'MineScreen ${{ steps.version.outputs.version }} (minescreen)',
            'Done (',
            'MineScreen dedicated-server smoke test reached SERVER_STARTED',
            'All dimensions are saved'
          )
          foreach ($text in $required) {
            if (-not $log.Contains($text)) {
              throw "Dedicated-server smoke test did not produce required marker: $text"
            }
          }
          if ($log -match '(?m)^\[[^\r\n]+/ERROR\]') {
            throw 'Dedicated-server smoke test logged an ERROR'
          }
          if ($log -match 'ClassNotFoundException|NoClassDefFoundError|Mixin apply failed') {
            throw 'Dedicated-server smoke test found a classloading or mixin failure'
          }

      - name: Prepare distributable files
        id: package
        shell: pwsh
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $jar = Get-ChildItem -LiteralPath build/libs -Filter "minescreen-$env:MOD_VERSION.jar" |
            Select-Object -First 1
          if (-not $jar) {
            throw "Expected build/libs/minescreen-$env:MOD_VERSION.jar was not produced"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $jar.FullName -Destination (Join-Path (Get-Location) dist)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $jar.FullName).Hash.ToUpperInvariant()
          "$hash  $($jar.Name)" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding utf8NoBOM
          $notes = "RELEASE_NOTES_$env:MOD_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Expected release notes file was not found: $notes"
          }
          Copy-Item -LiteralPath $notes -Destination dist/RELEASE_NOTES.md
          "jar=$($jar.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: minescreen-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: minescreen-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Publish GitHub Release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MineScreen Canvas $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "MineScreen Canvas $GITHUB_REF_NAME" \
              --notes-file dist/RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
