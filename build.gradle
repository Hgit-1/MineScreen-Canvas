plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // Keep local artifacts first for offline development, then strictly route third-party groups.
    mavenLocal()
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroup 'org.bytedeco'
        }
    }
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroup 'org.mozilla'
        }
    }
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            includeGroup 'com.google.code.gson'
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://mcef-download.cinemamod.com/repositories/releases' }
        }
        filter {
            includeGroup 'com.cinemamod'
        }
    }
    // Use Create's published Modrinth artifact for the optional compile-time API. The upstream
    // Create Maven occasionally serves an incomplete TLS chain to clean JDK trust stores (notably
    // GitHub's Windows runners). Modrinth is already an official Create distribution channel and
    // avoids weakening Gradle's TLS verification or importing an untrusted certificate.
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientSmoke {
            client()
            // Keep the automated client run isolated from the developer's normal run directory
            // and from dedicated-server runs. MCEF must be discovered as an actual NeoForge mod,
            // not merely placed on the legacy Java class path.
            gameDirectory = project.file('run/client-smoke')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'minescreen.qa.autoStopClient', 'true'
            systemProperty 'minescreen.qa.requireMcef', 'true'
        }
        clientCoreSmoke {
            client()
            // No MCEF mod is installed into this directory. This proves the optional dependency
            // and delayed factory allow a core-only client to render and shut down cleanly.
            gameDirectory = project.file('run/client-core-smoke')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'minescreen.qa.autoStopClient', 'true'
            systemProperty 'minescreen.qa.requireMcef', 'false'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        serverSmoke {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'minescreen.qa.autoStopServer', 'true'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Optional user-supplied UI art. Missing files are intentionally ignored so the default build
// remains a clean, minimal interface without generated character art or missing-texture markers.
tasks.named('processResources', ProcessResources).configure {
    from('user_assets') {
        include 'panel_decoration.png'
        include 'loading_decoration.png'
        into 'assets/minescreen/textures/gui/custom'
    }
}

configurations {
    scriptEmbed {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    mcefClientSmokeMod {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    createCompileBundle {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Ponder is nested inside the official Create distribution. Extract that exact pinned nested jar
// for javac instead of contacting a second Maven coordinate. It remains compile-only and is never
// packaged into MineScreen; an installed Create mod supplies Ponder at runtime.
def ponderCompileVersion = '1.0.81+mc1.21.1'
def ponderCompileName = "ponder-neoforge-${ponderCompileVersion}.jar"
def ponderCompileJar = layout.buildDirectory.file("compile-dependencies/${ponderCompileName}")
def extractPonderCompileJar = tasks.register('extractPonderCompileJar') {
    inputs.files(configurations.createCompileBundle)
    outputs.file(ponderCompileJar)
    doLast {
        File createJar = configurations.createCompileBundle.singleFile
        File output = ponderCompileJar.get().asFile
        output.parentFile.mkdirs()
        new java.util.zip.ZipFile(createJar).withCloseable { archive ->
            def entry = archive.getEntry("META-INF/jarjar/${ponderCompileName}")
            if (entry == null) {
                throw new GradleException("Pinned Create artifact does not contain ${ponderCompileName}")
            }
            output.withOutputStream { target ->
                archive.getInputStream(entry).withCloseable { source -> source.transferTo(target) }
            }
        }
        String actual = java.security.MessageDigest.getInstance('SHA-256')
                .digest(output.bytes).encodeHex().toString().toUpperCase(Locale.ROOT)
        String expected = 'B94099A82D51FA378F6CE30D788CA3F8CF0699FE16BBB536B516B03025301A42'
        if (actual != expected) {
            output.delete()
            throw new GradleException("Extracted Ponder checksum mismatch: ${actual}")
        }
    }
}
def ponderCompileFiles = files(ponderCompileJar)
ponderCompileFiles.builtBy(extractPonderCompileJar)

dependencies {
    // Only compile the legacy JavaCPP decoder sources. MineScreen no longer packages JavaCPP or
    // any FFmpeg native library: a platform-specific, SHA-256-pinned runtime is downloaded on
    // demand and executed through ProcessBuilder, which keeps the universal mod jar small.
    compileOnly 'org.bytedeco:ffmpeg:7.1-1.5.11'
    compileOnly 'org.bytedeco:javacpp:1.5.11'

    // Rhino is a compact, pure-Java import-time engine. MineScreen exposes no Java objects to the
    // template scope, denies all class access, and enforces instruction/time/output budgets. The
    // generated declarative scene is saved and the script is never executed during world ticks.
    compileOnly 'org.mozilla:rhino:1.9.1'
    scriptEmbed 'org.mozilla:rhino:1.9.1'
    testImplementation('com.google.code.gson:gson:2.11.0') { transitive = false }

    // MCEF is an optional client backend, never shaded into MineScreen. Runtime code reaches its
    // API only through a delayed compatibility factory after the platform and mod are both probed.
    compileOnly 'com.cinemamod:mcef:2.1.6-1.21.1'
    mcefClientSmokeMod 'com.cinemamod:mcef-neoforge:2.1.6-1.21.1'

    // Optional Create carriage API. Client rendering and server timetable bridges are both loaded
    // reflectively, so neither side loads Create classes when the mod is absent.
    createCompileBundle("maven.modrinth:create:${create_modrinth_version}") { transitive = false }
    compileOnly configurations.createCompileBundle.incoming.artifactView { }.files
    // StationBlockEntity inherits Ponder's VirtualBlockEntity. Keep this compile-only as well;
    // installed Create clients already provide it and dedicated servers without Create never load
    // the reflective bridge.
    compileOnly ponderCompileFiles

}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version
        )
    }
    from('LICENSE') {
        into 'META-INF/licenses'
        rename { 'minescreen-MIT.txt' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
}

// Keep Rhino off NeoForge's main class path. The unmodified upstream jar is a private resource that
// is extracted only for the disposable import worker, preventing package/version collisions with
// other mods and avoiding any server-side engine initialization.
tasks.named('processResources', ProcessResources).configure {
    from(configurations.scriptEmbed) {
        into 'META-INF/minescreen/script'
        rename { 'rhino-1.9.1.jar' }
    }
}

def prepareClientSmokeMcef = tasks.register('prepareClientSmokeMcef', Copy) {
    description = 'Installs the external MCEF NeoForge mod into the isolated client smoke run.'
    group = 'verification'
    from(configurations.mcefClientSmokeMod)
    into(layout.projectDirectory.dir('run/client-smoke/mods'))
}

tasks.named('runClientSmoke').configure {
    dependsOn prepareClientSmokeMcef
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    gradleVersion = '8.9'
}

tasks.register('tightDecoderTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.vnc.TightDecoderTestHarness'
}

tasks.register('rfbExternalProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.vnc.RfbExternalProbe'
}

tasks.register('rfbLoopbackTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.vnc.RfbLoopbackTestHarness'
}

// Manual probes that instantiate Minecraft client classes need Mojang's transitive runtime
// libraries in addition to the merged game jar. MCEF is intentionally excluded: neither decoder
// nor template import should require Chromium to be installed just to run a release diagnostic.
def clientProbeMinecraftClasspath = configurations.clientLegacyClasspath.copyRecursive()
clientProbeMinecraftClasspath.exclude group: 'com.cinemamod'

tasks.register('videoDecoderProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + clientProbeMinecraftClasspath + files(
            layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-minecraft-merged.jar"))
    mainClass = 'dev.minescreen.client.video.FfmpegVideoProbe'
    if (providers.gradleProperty('videoProbeSource').isPresent()) {
        args providers.gradleProperty('videoProbeSource').get()
        if (providers.gradleProperty('videoProbeWidth').isPresent()
                && providers.gradleProperty('videoProbeHeight').isPresent()) {
            args providers.gradleProperty('videoProbeWidth').get()
            args providers.gradleProperty('videoProbeHeight').get()
        }
    }
}

tasks.register('externalFfmpegProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + clientProbeMinecraftClasspath + files(
            layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-minecraft-merged.jar"))
    mainClass = 'dev.minescreen.client.video.ExternalFfmpegVideoProbe'
    if (providers.gradleProperty('externalFfmpegPath').isPresent()
            && providers.gradleProperty('externalFfprobePath').isPresent()
            && providers.gradleProperty('videoProbeSource').isPresent()) {
        args providers.gradleProperty('externalFfmpegPath').get(),
                providers.gradleProperty('externalFfprobePath').get(),
                providers.gradleProperty('videoProbeSource').get()
    }
}

tasks.register('profileSourceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.content.ClientScreenProfileSourceTestHarness'
}

tasks.register('responsiveLayoutTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.ResponsiveLayoutTestHarness'
}

tasks.register('trafficImportTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + clientProbeMinecraftClasspath + files(
            layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-minecraft-merged.jar"))
    mainClass = 'dev.minescreen.client.traffic.TrafficImportTestHarness'
    if (providers.gradleProperty('rmpProbeSource').isPresent()) {
        args providers.gradleProperty('rmpProbeSource').get()
    }
    if (providers.gradleProperty('trafficScriptProbeSource').isPresent()) {
        if (!providers.gradleProperty('rmpProbeSource').isPresent()) {
            args ''
        }
        args providers.gradleProperty('trafficScriptProbeSource').get()
    }
    if (providers.gradleProperty('trafficManifestProbeSource').isPresent()) {
        args '--manifest', providers.gradleProperty('trafficManifestProbeSource').get()
    }
}

tasks.register('trafficTemplateSyncTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.network.TrafficTemplateSyncTestHarness'
}

tasks.register('securityPolicyTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.network.SecurityPolicyTestHarness'
}

tasks.register('platformFingerprintTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.compat.PlatformFingerprintTestHarness'
}

tasks.register('ffmpegRuntimeSecurityTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.client.compat.FfmpegRuntimeSecurityTestHarness'
}

tasks.register('trainEtaEstimatorTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.TrainEtaEstimatorTestHarness'
}

tasks.register('releaseIntegrityTest', JavaExec) {
    dependsOn tasks.named('jar'), testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minescreen.ReleaseIntegrityTestHarness'
    args project.projectDir.absolutePath,
            layout.buildDirectory.file("libs/${mod_id}-${mod_version}.jar").get().asFile.absolutePath,
            mod_version
}

tasks.register('lcdStudioSimulationTest', Exec) {
    workingDir project.file('examples/traffic_templates/linear_dual_language_lcd')
    commandLine 'node', 'ci_test.js'
}

tasks.named('check').configure {
    dependsOn tasks.named('tightDecoderTest')
    dependsOn tasks.named('rfbLoopbackTest')
    dependsOn tasks.named('responsiveLayoutTest')
    dependsOn tasks.named('profileSourceTest')
    dependsOn tasks.named('trafficImportTest')
    dependsOn tasks.named('trafficTemplateSyncTest')
    dependsOn tasks.named('securityPolicyTest')
    dependsOn tasks.named('platformFingerprintTest')
    dependsOn tasks.named('ffmpegRuntimeSecurityTest')
    dependsOn tasks.named('trainEtaEstimatorTest')
    dependsOn tasks.named('releaseIntegrityTest')
    dependsOn tasks.named('lcdStudioSimulationTest')
}
