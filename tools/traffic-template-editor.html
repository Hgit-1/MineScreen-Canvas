<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MineScreen Traffic Template Editor</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0d131b;color:#eef6ff}
    body{max-width:780px;margin:32px auto;padding:0 18px}main{background:#172331;border:1px solid #334b62;border-radius:14px;padding:22px}
    label{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;margin:10px 0}
    input{background:#0f1822;color:#fff;border:1px solid #48647e;border-radius:7px;padding:9px}
    button{background:#ffad32;color:#15100a;border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
    pre{background:#091018;border-radius:9px;padding:14px;overflow:auto}.note{color:#a9bed1;font-size:14px}
  </style>
</head>
<body><main>
  <h1>MineScreen 交通模板编辑器</h1>
  <p class="note">生成声明式 manifest；不会生成或执行 JavaScript。Rail Map Toolkit 请先导出 PNG。</p>
  <label>模板 ID <input id="id" value="metro_blue" pattern="[a-z0-9._-]+"></label>
  <label>显示名称 <input id="name" value="Metro Blue Line"></label>
  <label>背景颜色 <input id="bg" type="color" value="#081522"></label>
  <label>文字颜色 <input id="fg" type="color" value="#ffffff"></label>
  <label>强调颜色 <input id="accent" type="color" value="#3a9bff"></label>
  <label>线路图 PNG 文件名 <input id="image" value="rail_map.png"></label>
  <p><button id="download">下载 manifest.json</button></p>
  <pre id="preview"></pre>
</main><script>
const ids=['id','name','bg','fg','accent','image'];
function value(id){return document.getElementById(id).value.trim()}
function manifest(){return {id:value('id').toLowerCase(),name:value('name'),layout:'builtin_transit_v1',background_color:'#FF'+value('bg').slice(1).toUpperCase(),text_color:'#FF'+value('fg').slice(1).toUpperCase(),accent_color:'#FF'+value('accent').slice(1).toUpperCase(),background_image:value('image')}}
function update(){document.getElementById('preview').textContent=JSON.stringify(manifest(),null,2)}
ids.forEach(id=>document.getElementById(id).addEventListener('input',update));update();
document.getElementById('download').onclick=()=>{const id=value('id').toLowerCase();if(!/^[a-z0-9._-]{1,64}$/.test(id)){alert('模板 ID 格式无效');return}const blob=new Blob([JSON.stringify(manifest(),null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
