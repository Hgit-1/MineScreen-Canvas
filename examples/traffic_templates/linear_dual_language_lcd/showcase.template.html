<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MineScreen 线性双语 LCD</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050708; }
    body { display: grid; place-items: center; color: #eef4f6;
      font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
    #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16)); background: #f2f3f4; }
    #screen, #screen-motion { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    #screen-motion { pointer-events: none; opacity: 0; }
    #screen-motion.lcd-motion { animation: lcd-motion .52s cubic-bezier(.22,.72,.22,1) forwards; }
    @keyframes lcd-motion {
      from { opacity: .82; clip-path: inset(18% 0 0 0); transform: translateX(22px); filter: blur(1.2px); }
      to { opacity: 0; clip-path: inset(18% 0 0 0); transform: translateX(-8px); filter: blur(0); }
    }
    #hud { position: absolute; inset: auto 14px 14px 14px; display: flex; align-items: center;
      gap: 8px; padding: 9px; border-radius: 11px; background: #0b1114dc;
      border: 1px solid #ffffff26; backdrop-filter: blur(10px); transition: opacity .22s ease; }
    #stage.hud-hidden #hud { opacity: 0; pointer-events: none; }
    #status { margin-right: auto; color: #d9e4e8; font-size: 13px; white-space: nowrap; }
    button { min-width: 40px; min-height: 36px; padding: 7px 11px; border: 1px solid #ffffff28;
      border-radius: 8px; background: #253139; color: #fff; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { background: #3b4a53; outline: 2px solid #ff9b42; outline-offset: 1px; }
    #pause { min-width: 78px; }
    #help { position: absolute; right: 14px; top: 14px; padding: 7px 10px; border-radius: 8px;
      background: #0b1114c7; color: #d9e4e8; font-size: 12px; opacity: 0;
      transition: opacity .22s ease; pointer-events: none; }
    #stage:hover #help, #stage:focus-within #help { opacity: 1; }
    @media (max-width: 700px) {
      #hud { inset: auto 6px 6px 6px; gap: 5px; padding: 6px; }
      button { min-width: 34px; min-height: 32px; padding: 5px 8px; }
      #status { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { #hud, #help { transition: none; } #screen-motion { display:none; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="MineScreen 线性双语列车信息显示">
    <canvas id="screen" width="1920" height="1080" role="img"
      aria-label="显示当前线路、下一站、预计时间、换乘线路与世界时间"></canvas>
    <canvas id="screen-motion" width="1920" height="1080" aria-hidden="true"></canvas>
    <div id="help">←/→ 切站　空格 暂停　P 切版面　F 全屏　H 隐藏控制栏</div>
    <nav id="hud" aria-label="展示控制">
      <span id="status">准备中</span>
      <button id="previous" type="button" aria-label="上一站">←</button>
      <button id="pause" type="button">暂停</button>
      <button id="next" type="button" aria-label="下一站">→</button>
      <button id="page" type="button">切换版面</button>
      <button id="fullscreen" type="button">全屏</button>
    </nav>
  </main>

  <script>
/*__MINESCREEN_GENERATOR__*/
  </script>
  <script>
    (() => {
      const canvas = document.getElementById('screen');
      const context = canvas.getContext('2d');
      const motionCanvas = document.getElementById('screen-motion');
      const motionContext = motionCanvas.getContext('2d');
      const stage = document.getElementById('stage');
      const statusNode = document.getElementById('status');
      const pauseButton = document.getElementById('pause');
      const query = new URLSearchParams(location.search);
      const languageProfiles = [
        {id: 'zh-en', primary: 'zh', secondary: 'en'},
        {id: 'ja-en', primary: 'ja', secondary: 'en'},
        {id: 'zh-ja', primary: 'zh', secondary: 'ja'}
      ];
      let profile = languageProfiles.find(item => item.id === query.get('profile')) ||
        languageProfiles.find(item => item.primary === query.get('primary') && item.secondary === query.get('secondary')) || languageProfiles[0];
      let primary = profile.primary;
      let secondary = profile.secondary;
      const requestedPage = ['route', 'next', 'arrival', 'auto'].includes(query.get('page'))
        ? query.get('page') : 'auto';
      const intervalMs = Math.max(2000, Math.min(60000, Number(query.get('interval')) * 1000 || 9000));
      const route = LinearLcdDemo.route;
      let index = Math.max(1, Math.min(Number(query.get('index')) || 3, route.stations.length - 1));
      let visiblePage = requestedPage === 'next' || requestedPage === 'arrival' ? requestedPage : 'route';
      let playing = query.get('autoplay') !== '0';
      let template;
      let timer;
      let hudTimer;
      const languageCycle = query.get('langCycle') !== '0';
      const languageInterval = Math.max(2000, Math.min(60000,
        Number(query.get('langInterval')) * 1000 || 8000));
      let languageTimer;

      function clockText() {
        const now = new Date();
        return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      }
      function cssColor(value) {
        const color = String(value || '#FFFFFFFF');
        return /^#[0-9a-f]{8}$/i.test(color) ? `#${color.slice(3)}${color.slice(1, 3)}` : color;
      }
      function resolveText(text) {
        const state = template?.traffic || {};
        return String(text || '').replace(/\$\{(line|destination|current|next|eta|status|game_time|train_name|service_type|carriage_number|carriage_count|upcoming_stops|direction|arrival_time)\}/g,
          (_, key) => key === 'game_time' ? clockText() : state[key] || '');
      }
      function snapshotBody() {
        motionContext.clearRect(0, 0, motionCanvas.width, motionCanvas.height);
        motionContext.drawImage(canvas, 0, 0);
        motionCanvas.classList.remove('lcd-motion');
        void motionCanvas.offsetWidth;
        motionCanvas.classList.add('lcd-motion');
      }
      function render(animate = false) {
        if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) snapshotBody();
        template = LinearLcdDemo.createTemplateFromRoute(route, index, primary, secondary, visiblePage);
        const w = canvas.width, h = canvas.height;
        context.clearRect(0, 0, w, h);
        context.textBaseline = 'top';
        context.lineCap = 'round';
        context.lineJoin = 'round';
        for (const element of template.elements) {
          context.fillStyle = cssColor(element.color);
          context.strokeStyle = cssColor(element.color);
          if (element.type === 'rect') {
            context.fillRect(element.x * w, element.y * h, element.width * w, element.height * h);
          } else if (element.type === 'ellipse') {
            context.beginPath();
            context.ellipse((element.x + element.width / 2) * w,
              (element.y + element.height / 2) * h,
              element.width * w / 2, element.height * h / 2, 0, 0, Math.PI * 2);
            context.fill();
          } else if (element.type === 'line') {
            context.lineWidth = Math.max(1, (Number(element.size) || 1) * h / 360);
            context.beginPath();
            context.moveTo(element.x * w, element.y * h);
            context.lineTo(element.x2 * w, element.y2 * h);
            context.stroke();
          } else if (element.type === 'text') {
            const size = Math.max(11, (Number(element.size) || 1) * h / 20);
            context.font = `${element.bold ? 700 : 500} ${size}px "Microsoft YaHei UI", ` +
              `"Noto Sans CJK SC", "Yu Gothic UI", "Segoe UI", sans-serif`;
            context.save();
            context.translate(element.x * w, element.y * h);
            context.rotate((Number(element.rotation) || 0) * Math.PI / 180);
            context.textAlign = element.align || 'left';
            const value = resolveText(element.text);
            if (element.vertical) {
              [...value].slice(0, 32).forEach((glyph, glyphIndex) =>
                context.fillText(glyph, 0, glyphIndex * size * 1.02));
            } else {
              const available = Number(element.max_width) > 0 ? Number(element.max_width) :
                element.align === 'right' ? element.x : element.align === 'center' ?
                  Math.min(element.x, 1 - element.x) * 2 : 1 - element.x;
              context.fillText(value, 0, 0, Math.max(size * 2, available * w * 0.96));
            }
            context.restore();
          }
        }
        statusNode.textContent = `${route.lineNames[primary]} · ${index}/${route.stations.length - 1} · ` +
          `${visiblePage === 'route' ? '线路窗口' : visiblePage === 'arrival' ? '到站前预报' : '下一站'} · ${playing ? '自动运行' : '已暂停'}`;
        pauseButton.textContent = playing ? '暂停' : '继续';
      }
      function rotateLanguage() {
        if (!languageCycle) return;
        profile = languageProfiles[(languageProfiles.indexOf(profile) + 1) % languageProfiles.length];
        primary = profile.primary;
        secondary = profile.secondary;
        render(true);
      }
      function schedule() {
        clearTimeout(timer);
        if (!playing || document.hidden) return;
        const delay = requestedPage === 'auto'
          ? (visiblePage === 'route' ? intervalMs * 0.45 : visiblePage === 'next' ? intervalMs * 0.30 : intervalMs * 0.25)
          : intervalMs;
        timer = setTimeout(() => {
          if (requestedPage === 'auto' && visiblePage === 'route') {
            visiblePage = 'next';
          } else if (requestedPage === 'auto' && visiblePage === 'next') {
            visiblePage = 'arrival';
          } else {
            index = index >= route.stations.length - 1 ? 1 : index + 1;
            if (requestedPage === 'auto') visiblePage = 'route';
          }
          render(true);
          schedule();
        }, delay);
      }
      function showHud() {
        stage.classList.remove('hud-hidden');
        clearTimeout(hudTimer);
        if (query.get('hud') !== '1') {
          hudTimer = setTimeout(() => stage.classList.add('hud-hidden'), 2600);
        }
      }
      function changeStation(delta) {
        index += delta;
        if (index < 1) index = route.stations.length - 1;
        if (index >= route.stations.length) index = 1;
        render(true);
        schedule();
      }
      function togglePause() {
        playing = !playing;
        render(true);
        schedule();
        showHud();
      }
      function togglePage() {
        visiblePage = visiblePage === 'route' ? 'next' : visiblePage === 'next' ? 'arrival' : 'route';
        render(true);
        schedule();
      }
      async function toggleFullscreen() {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      }

      document.getElementById('previous').onclick = () => changeStation(-1);
      document.getElementById('next').onclick = () => changeStation(1);
      document.getElementById('pause').onclick = togglePause;
      document.getElementById('page').onclick = togglePage;
      document.getElementById('fullscreen').onclick = toggleFullscreen;
      stage.addEventListener('pointermove', showHud);
      stage.addEventListener('pointerdown', showHud);
      document.addEventListener('visibilitychange', schedule);
      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight') changeStation(1);
        else if (event.key === 'ArrowLeft') changeStation(-1);
        else if (event.key === ' ') { event.preventDefault(); togglePause(); }
        else if (event.key.toLowerCase() === 'p') togglePage();
        else if (event.key.toLowerCase() === 'f') toggleFullscreen();
        else if (event.key.toLowerCase() === 'h') stage.classList.toggle('hud-hidden');
      });
      setInterval(() => {
        if (template) render();
      }, 1000);
      if (languageCycle) languageTimer = setInterval(rotateLanguage, languageInterval);
      render();
      schedule();
      showHud();
    })();
  </script>
</body>
</html>
