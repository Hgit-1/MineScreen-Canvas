<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MineScreen Linear LCD JS Embed</title>
<style>
  html,body { margin:0; min-height:100%; background:#111; }
  #lcd { width:min(100vw, 1600px); margin:0 auto; }
</style>
<div id="lcd"></div>
<script src="linear_lcd_showcase.js"></script>
<script>
  MineScreenLinearLcd.mount("#lcd", {
    primary: "zh",
    secondary: "en",
    page: "auto",
    index: 4,
    interval: 9000,
    controls: true,
    languageCycle: true,
    languageInterval: 8000
  });
</script>
